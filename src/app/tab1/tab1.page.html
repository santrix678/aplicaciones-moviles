<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Ordenes Lavandería</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando órdenes...</p>
  </div>

  <ion-list *ngIf="!cargando && ordenes.length > 0">
    <ion-item *ngFor="let item of ordenes">
      <ion-label>
        <h2>{{ item.servicio }}</h2>
        <p>Cliente: {{ item.cliente }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="!cargando && ordenes.length === 0" class="ion-text-center">
    <p>No se encontraron órdenes registradas.</p>
  </div>
</ion-content>
