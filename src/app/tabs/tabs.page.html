<ion-tabs>

  <ion-tab-bar slot="bottom">

    <!-- ============================= -->
    <!-- INICIO - TODOS LOS USUARIOS -->
    <!-- ============================= -->

    <ion-tab-button
      tab="tab1"
      href="/tabs/tab1">

      <ion-icon
        aria-hidden="true"
        name="home-outline">
      </ion-icon>

      <ion-label>
        Inicio
      </ion-label>

    </ion-tab-button>


    <!-- ============================= -->
    <!-- ÓRDENES -->
    <!-- ADMINISTRADOR -->
    <!-- ============================= -->

    <ion-tab-button
      *ngIf="esAdministrador"
      tab="tab2"
      href="/tabs/tab2">

      <ion-icon
        aria-hidden="true"
        name="list-outline">
      </ion-icon>

      <ion-label>
        Órdenes
      </ion-label>

    </ion-tab-button>


    <!-- ============================= -->
    <!-- MIS ÓRDENES -->
    <!-- CLIENTE -->
    <!-- ============================= -->

    <ion-tab-button
      *ngIf="esCliente"
      tab="tab2"
      href="/tabs/tab2">

      <ion-icon
        aria-hidden="true"
        name="list-outline">
      </ion-icon>

      <ion-label>
        Mis órdenes
      </ion-label>

    </ion-tab-button>


    <!-- ============================= -->
    <!-- REPORTE -->
    <!-- SOLO ADMINISTRADOR -->
    <!-- ============================= -->

    <ion-tab-button
      *ngIf="esAdministrador"
      tab="tab3"
      href="/tabs/tab3">

      <ion-icon
        aria-hidden="true"
        name="bar-chart-outline">
      </ion-icon>

      <ion-label>
        Reporte
      </ion-label>

    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
